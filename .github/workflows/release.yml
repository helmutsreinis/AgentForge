name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer package version
        required: true
        default: 1.0.0
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - id: version
        shell: pwsh
        run: |
          $value = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($value -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') { throw 'Release tag/input is not stable SemVer.' }
          "value=$value" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        run: ./eng/build-release.ps1 -Version '${{ steps.version.outputs.value }}' -RuntimeIdentifiers '${{ matrix.rid }}'
      - shell: pwsh
        run: dotnet run --project tools/AgentForge.Release/AgentForge.Release.csproj --configuration Release --no-restore -- smoke --release-directory artifacts/release --rid '${{ matrix.rid }}'
      - id: subject
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath artifacts/release -File | Where-Object { $_.Name -like 'AgentForge-*.zip' -or $_.Name -like 'AgentForge-*.tar.gz' })
          if ($archives.Count -ne 1) { throw 'Exactly one platform archive is required.' }
          $archive = $archives[0]
          $baseName = if ($archive.Name.EndsWith('.tar.gz')) { $archive.Name.Substring(0, $archive.Name.Length - 7) } else { [IO.Path]::GetFileNameWithoutExtension($archive.Name) }
          $checksum = Join-Path $archive.DirectoryName "$baseName.sha256"
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($checksum, "$hash  $($archive.Name)`n", [Text.UTF8Encoding]::new($false))
          $sbom = Join-Path $archive.DirectoryName "$baseName.spdx.json"
          Copy-Item -LiteralPath artifacts/release/AgentForge.spdx.json -Destination $sbom
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "sbom=$sbom" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.subject.outputs.archive }}
            ${{ steps.subject.outputs.checksum }}
            ${{ steps.subject.outputs.sbom }}
      - uses: actions/upload-artifact@v4
        with:
          name: AgentForge-${{ matrix.rid }}
          path: |
            artifacts/release/AgentForge-*
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Build and smoke secure-default image
        run: |
          docker build -t agentforge-r1:smoke .
          docker run -d --name agentforge-r1-smoke agentforge-r1:smoke
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' agentforge-r1-smoke)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then docker logs agentforge-r1-smoke; exit 1; fi
            sleep 2
          done
          docker logs agentforge-r1-smoke
          exit 1
      - name: Build and verify constrained execution image
        run: |
          docker build -f packaging/container/Dockerfile.sandbox -t agentforge-sandbox-r1:smoke .
          image_id=$(docker image inspect --format '{{.Id}}' agentforge-sandbox-r1:smoke)
          dotnet restore tests/AgentForge.CrossPlatformTests/AgentForge.CrossPlatformTests.csproj --locked-mode
          AGENTFORGE_TEST_DOCKER_RUNTIME=$(command -v docker) \
          AGENTFORGE_TEST_DOCKER_IMAGE=$image_id \
          dotnet test tests/AgentForge.CrossPlatformTests/AgentForge.CrossPlatformTests.csproj \
            --configuration Release --filter FullyQualifiedName~DockerSandboxLiveTests
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/helmutsreinis/agentforge:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/helmutsreinis/agentforge
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  publish:
    if: github.event_name == 'push'
    needs: [package, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -type f -name 'AgentForge-*' -o -name 'SHA256SUMS' -o -name 'AgentForge.spdx.json'
          gh release create '${{ github.ref_name }}' $(find release -type f \( -name 'AgentForge-*' -o -name 'SHA256SUMS' -o -name 'AgentForge.spdx.json' \)) --repo '${{ github.repository }}' --verify-tag --generate-notes
