name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults/coverage
      - name: Enforce merged product and critical-path coverage
        shell: pwsh
        run: ./eng/verify-coverage.ps1 -ResultsDirectory TestResults/coverage
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet list AgentForge.slnx package --vulnerable --include-transitive
      - shell: pwsh
        run: ./eng/verify-release-assets.ps1
      - name: Build self-contained package
        shell: pwsh
        run: |
          $rid = if ('${{ runner.os }}' -eq 'Windows') { 'win-x64' } else { 'linux-x64' }
          ./eng/build-release.ps1 -Version 1.0.0 -RuntimeIdentifiers $rid
          dotnet run --project tools/AgentForge.Release/AgentForge.Release.csproj --configuration Release --no-restore -- smoke --release-directory artifacts/release --rid $rid
      - shell: pwsh
        run: ./scripts/verify-no-secrets.ps1
